<!DOCTYPE html>
<html lang="en" class="h-100">
	<head>
		<!-- set the encoding of your site -->
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="icon" href="{{url_for('static',filename='images/food.svg')}}" />
		{% block metatags %}
        {% endblock %}

		<!-- Bootstrap 5 style css -->
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" 
		      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" 
			  crossorigin="anonymous"> 

		<!-- Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
		<!-- Leaflet -->
		<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
		integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
		crossorigin=""/>
		<!-- Geosearch -->
		<link rel="stylesheet" href="https://unpkg.com/leaflet-geosearch@3.11.1/dist/geosearch.css"/>
		
		<!-- Custom styles for this template -->
		<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">

	</head>
	<body class="d-flex flex-column h-100 wix-madefor">
		
		<header id="pageHeader" class="position-absolute w-100 bg-white">
			<!-- Navbar -->
			{% include "incl_navbar.html" %}
		</header>
		
		<main class="flex-shrink-0">
		<!-- Start Main content -->
		{% block contents %}
		{% endblock %}
		<!-- End Main content -->
		</main>	
		
		<footer class="footer mt-auto py-3 bg-light">
		<!-- Footer -->
		{% include "incl_footer.html" %}
		</footer>

		<!-- Bootstrap 5 JavaScript -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
			    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" 
				crossorigin="anonymous"></script>
		<!-- Leaflet.js -->
		<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
		integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
		crossorigin=""></script>
		<!-- Geosearch -->
		<script src="https://unpkg.com/leaflet-geosearch@latest/dist/bundle.min.js"></script>
		
		<!-- get custom JavaScript -->
		<script src="{{url_for('static',filename='js/custom.js')}}"></script>
		
		{% include "incl_modal.html" %}
	</body>
</html>
